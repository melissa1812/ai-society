<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Society Stats | Birmingham AI Society</title>
<link rel="icon" href="assets/img/logo-mark.jpg">
<script>
(function () {
  var d = document.documentElement, s = {};
  try { s = JSON.parse(localStorage.getItem("ais-prefs") || "{}"); } catch (e) {}
  var t = s.theme || "system";
  if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  d.dataset.theme = t;
  if (s.font) d.dataset.font = s.font;
  if (s.size) d.dataset.size = s.size;
  if (s.contrast) d.dataset.contrast = "high";
  if (s.calm) d.dataset.calm = "on";
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=Lexend:wght@400;600&family=Poppins:wght@400;500;600&family=Syncopate:wght@700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/stats.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./">
      <img src="assets/img/logo-mark.jpg" alt="" width="40" height="40">
      <span>Birmingham<br>AI Society</span>
    </a>
    <div style="flex:1"></div>
    <div class="tools">
      <button class="btn btn-plain btn-small" id="refresh" type="button" hidden>Refresh</button>
      <button class="btn btn-plain btn-small" id="signout" type="button" hidden>Lock</button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to light mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="view">
  <div class="wrap">
    <header class="vh">
      <div class="vh-ring" aria-hidden="true"></div>
      <h1 class="vh-title">Society stats</h1>
      <p class="vh-lede" id="lede">Members, visits, attendance and feedback. Committee only.</p>
    </header>

    <form id="gate" class="ring gate" novalidate>
      <div class="field"><label for="key">Committee passcode</label><input id="key" type="password" autocomplete="current-password" required></div>
      <div class="msg" id="gate-msg" role="alert" hidden></div>
      <div><button class="btn" type="submit" id="gate-btn">Open stats</button></div>
    </form>

    <div id="dash" hidden></div>
  </div>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="assets/js/content.js"></script>
<script src="assets/js/stats.js"></script>
</body>
</html>
